<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manuel Monsalve's portafolio">
    <meta name="keywords" content="portafolio, desarrollador web, programador, proyectos, contacto">
    <meta name="author" content="Manuel Monsalve">
    
    <title>Portafolio Web</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Stylesheets (order matters!) -->
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/identity.css">
    <link rel="stylesheet" href="src/css/nav.css">
    <link rel="stylesheet" href="src/css/theme-toggle.css">
    <link rel="stylesheet" href="src/css/lang-toggle.css">
    <link rel="stylesheet" href="src/css/burger.css">
    <link rel="stylesheet" href="src/css/section.css">
    <link rel="stylesheet" href="src/css/section-about.css">
    
    <script>
        // Load lang to avoid gibberish
        const savedLanguage = localStorage.getItem("language");

        if (savedLanguage === "en" || savedLanguage === "es") {
            document.documentElement.lang = savedLanguage;
        } else {
            document.documentElement.lang = navigator.language.startsWith("es") ? "es" : "en";
        }

        // Load theme to avoid flashbang
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        } else {
            const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
            systemPrefersDark ? "dark" : "light";
        }
    </script>
</head>
<body>
    <header>
        <div class="logo-identity">
            <img src="src/assets/nan.png" alt="Logo">
            <div class="logo-identity-title">
                <h1>Alejandro Manuel Monsalve</h1>
                <p data-i18n="head.profession"></p>
            </div>
        </div>
        <nav>
            <div class="nav-collapsibles">
                <div class="nav-anchors">
                    <a href="#about" data-i18n="nav.about">About me</a>
                    <a href="#projects" data-i18n="nav.projects">Projects</a>
                    <a href="#experience" data-i18n="nav.experience">Experience</a>
                    <a href="#contact" data-i18n="nav.contact">Contact</a>
                </div>
                <div class="nav-acc-buttons">
                    <!-- Theme button -->
                    <button type="button" id="theme-toggle" aria-label="Toggle theme">
                        <span class="toggle-track">
                            <span class="toggle-thumb">
                                <span class="thumb-icon"></span>
                            </span>
                        </span>
                    </button>
                    <!-- Language button -->
                    <button type="button" id="language-toggle" aria-label="Change language">
                        🌎EN
                    </button>
                </div>
            </div>
            <div class="nav-burger">
                <!-- borgar -->
                <button type="button" 
                        id="burger-menu-toggle" 
                        aria-label="Open navigation menu" 
                        aria-expanded="false">
                    <svg 
                        class="burger-icon" 
                        viewBox="0 0 24 24" 
                        width="22" 
                        height="22" 
                        aria-hidden="true">
                        <line class="line top" x1="3" y1="6" x2="21" y2="6" />
                        <line class="line middle" x1="3" y1="12" x2="21" y2="12" />
                        <line class="line bottom" x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
            </div>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2 data-i18n="nav.about">About me</h2>

            <div class="section-content">
                <article>
                    <p data-i18n="main.about"></p>
                </article>

                <div class="section-image">
                    <img src="src/assets/about.jpg" alt="Profile">
                </div>
            </div>
        </section>

        <section id="projects">
            <h2 data-i18n="nav.projects">Projects</h2>

            <div class="section-content">
                <article>
                    <p data-i18n="main.projects"></p>
                </article>

                <div class="section-image">
                    <img src="src/assets/projects.png" alt="Project A">
                </div>
            </div>
        </section>

        <section id="experience">
            <h2 data-i18n="nav.experience">Experience</h2>

            <div class="section-content">
                <article>
                    <p data-i18n="main.experience"></p>
                </article>

                <div class="section-image">
                    <img src="src/assets/experience.png" alt="">
                </div>
            </div>
        </section>

        <section id="contact">
            <h2 data-i18n="nav.contact">Contact</h2>

            <div class="section-content">
                <article>
                    <p data-i18n="main.contact"></p>
                </article>

                <div class="section-image">
                    <img src="src/assets/contact.png" alt="">
                </div>
            </div>
        </section>
    </main>


    <script src="src/js/app.js"></script>
</body>
</html>
