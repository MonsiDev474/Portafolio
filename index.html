<!DOCTYPE html>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Doppio+One&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script>
        // Load theme to avoid flashbang
        let savedTheme = null;
        try {
        savedTheme = localStorage.getItem("theme");
        } catch (_e) {
            console.warn("Failed to retrieve theme from local storage")
        }

        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        } else {
            const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
            systemPrefersDark ? "dark" : "light";
        }

        // Load saved lang if any
        const savedLanguage = localStorage.getItem("language");

        if (savedLanguage === "en" || savedLanguage === "es") {
            document.documentElement.lang = savedLanguage;
        } else {
            document.documentElement.lang = navigator.language.startsWith("es") ? "es" : "en";
        }
    </script>

    <!-- Stylesheets (order matters!) -->
    <link rel="stylesheet" href="src/css/variables.css">
